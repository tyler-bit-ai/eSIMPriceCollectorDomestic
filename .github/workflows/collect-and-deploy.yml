name: Collect And Deploy Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 매주 일요일 19:17 UTC (한국 시간 월요일 04:17)
    - cron: "17 19 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      run_status: ${{ steps.crawl.outputs.run_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML playwright

      - name: Install Playwright Browser
        run: python -m playwright install chromium

      # push 이벤트는 커밋된 데이터를 그대로 재배포하고, 수집은 schedule/workflow_dispatch에서만 수행한다.
      - name: Run Crawl
        id: crawl
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set +e
          python -m app crawl --registry config/source_registry.yml --out data --publish-dashboard
          exit_code=$?
          echo "crawl_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "run_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$exit_code" -eq 2 ]; then
            echo "run_status=partial_success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_status=failure" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Run Tests
        run: python -m pytest -q

      - name: Verify Dashboard Payload Exists
        shell: bash
        run: |
          test -f dashboard/data/latest.json
          test -f dashboard/index.html
          test -f dashboard/app.js
          test -f dashboard/styles.css

      # 수집 결과를 저장소에 커밋해 이력을 누적하고, 주기적인 커밋으로 schedule 60일 비활성화를 방지한다.
      - name: Commit Collected Data
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data dashboard/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          run_id=$(python -c "import json; print(json.load(open('data/latest/run_metadata.json'))['run_id'])")
          git commit -m "Refresh eSIM pricing data (${run_id})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Crawl Logs
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: crawl-logs
          path: |
            data/failed.jsonl
            data/runs
            data/latest/run_metadata.json
          if-no-files-found: warn

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: collect
    if: ${{ needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
